name: Package macOS beta
on:
  push:
    branches: [main]
    tags: ['v*-beta.*']
permissions:
  contents: read
jobs:
  release:
    runs-on: macos-14
    env:
      RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v0.0.0-beta.0' }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Verify source and software tests
        run: |
          set -o pipefail
          python3 scripts/build-opus.py
          python3 scripts/check-release.py
          python3 scripts/audit-localization.py --check
          swift test 2>&1 | tee /tmp/xvico-tests.log
      - name: Build public beta without Apple tools
        env:
          XVICO_SIGNING_DIRECTORY: ${{ runner.temp }}/xvico-signing
        run: |
          set -o pipefail
          python3 - <<'PY' 2>&1 | tee /tmp/xvico-build.log
          from pathlib import Path
          import os, shlex, subprocess
          subprocess.run(['python3', 'scripts/sign-local.py', '--fingerprint'], check=True)
          keychain = str(Path(os.environ['XVICO_SIGNING_DIRECTORY']) / 'identity.keychain-db')
          previous = shlex.split(subprocess.check_output(['security', 'list-keychains', '-d', 'user'], text=True))
          # On macOS 14, codesign also needs the ephemeral keychain in the
          # runner's search list to resolve its private key. Local builds do not.
          subprocess.run(['security', 'list-keychains', '-d', 'user', '-s', keychain, *previous], check=True)
          subprocess.run(['./build-app.sh', '--output', 'dist/public-build/Xvico.app',
                          '--without-apple-runtime', '--release-version', os.environ['RELEASE_TAG'][1:]], check=True)
          PY
      - name: Create and verify DMG and ZIP
        run: |
          set -o pipefail
          python3 scripts/package-release.py --app dist/public-build/Xvico.app --version "${RELEASE_TAG#v}" 2>&1 | tee /tmp/xvico-package.log
      - name: Publish prerelease assets
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -o pipefail
          gh release create "$RELEASE_TAG" dist/releases/*.dmg dist/releases/*.zip dist/releases/SHA256SUMS.txt dist/releases/release-manifest.json dist/releases/INSTALL.md --verify-tag --prerelease --title "Xvico ${RELEASE_TAG#v} · Apple Silicon" --notes-file dist/releases/INSTALL.md 2>&1 | tee /tmp/xvico-publish.log
      - name: Report failures
        if: failure()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          for name in ['publish', 'package', 'build', 'tests']:
              path = Path('/tmp/xvico-' + name + '.log')
              if not path.exists(): continue
              lines = path.read_text().splitlines()
              # GitHub exposes only ten error annotations per step. Report
              # the most recent stage first, rather than filling it with tests.
              failures = [line for line in lines if re.search(r'error:|RuntimeError:|Exception:|SystemExit:', line)]
              for line in (failures or lines[-10:])[:10]:
                  print('::error title=Release ' + name + '::' + line[:1800].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))
              break
          PY
      - name: Remove temporary signing keychain
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/xvico-signing/identity.keychain-db" ]; then
            security delete-keychain "$RUNNER_TEMP/xvico-signing/identity.keychain-db"
          fi
